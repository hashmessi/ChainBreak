services:
  - type: web
    name: chainbreak-engine
    runtime: python
    buildCommand: "export CARGO_HOME=/tmp/cargo && npm --prefix frontend install && npm --prefix frontend run build && pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CARGO_HOME
        value: /tmp/cargo
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: liquid/lfm-2.5-2.6b:free
    healthCheckPath: /api/health
